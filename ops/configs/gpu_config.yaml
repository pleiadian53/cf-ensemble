# Default remote-training infrastructure for cf-ensemble (adapted from ssl-lab/ops).
#
# SkyPilot orchestrates; RunPod is the provider (a config value, not hard-coded).
# Override any field from the driver CLIs (e.g. --gpu a100, --use-volume).
gpu: a40                                       # see ops.gpu_runner.GPU_SPECS for choices
cloud: runpod
docker_image: nvcr.io/nvidia/pytorch:25.02-py3

# RunPod network volume: persistent storage across pod lifecycles. Reuses the
# shared "AI lab extension" volume (500 GB, CA-MTL-1). The pod is auto-placed in
# the volume's datacenter — no region field needed. Project outputs/pip-cache are
# namespaced under /runpod-volume/cf-ensemble/ to avoid collisions with sibling
# projects (ssl-lab, agentic-spliceai) that share this volume.
use_volume: true
volume_name: "AI lab extension"
volume_mount: /runpod-volume

# Project working directory uploaded to the pod (the cf-ensemble repo root).
# .skyignore keeps local-only trees (data, output, docs, site, notebooks, dev) out.
workdir: .

# Local input/dataset directory (relative to the project root). Large datasets
# are staged to the volume with examples/ops/ops_stage_data.py, not uploaded with
# the workdir.
#
# Storage dedup: datasets shared across projects live once in a project-neutral
# data lake; set
#   CFENSEMBLE_DATA_ROOT=/path/to/shared/data-lake
# and symlink only the datasets you reuse into data/ via ops.datasets.link_dataset.
data_path: data

# Setup commands run once on the pod before the job.
#
# NGC PyTorch images ship an optimized CUDA torch; a plain `pip install .` could
# pull a PyPI torch over it. So install cfensemble with --no-deps (pip fetches
# poetry-core for the build) and add only the small runtime deps the current
# trainers use. Non-editable install: the NGC image's setuptools can produce
# broken src-layout editable finders. NGC images can pin pip via PIP_CONSTRAINT;
# unset it so these installs pass.
setup_cmd: |
  unset PIP_CONSTRAINT 2>/dev/null || true
  export PIP_CACHE_DIR=/runpod-volume/cf-ensemble/pip-cache
  mkdir -p "$PIP_CACHE_DIR"
  pip install --no-deps .
  pip install numpy pandas scipy scikit-learn tqdm pyyaml pyarrow matplotlib seaborn

# Where the job writes results on the pod, and where they are rsynced back to.
# Namespaced under the shared volume so results persist across pods.
output_remote: /runpod-volume/cf-ensemble/output
output_local: output
